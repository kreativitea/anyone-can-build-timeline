<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Timeline</title>
  <script>
    // Before the page is drawn: use the colours chosen in this browser, if any.
    // The same key and the same two values as savedTheme() in app.js.
    try {
      var theme = localStorage.getItem("timeline-theme");
      if (theme === "light" || theme === "dark") {
        document.documentElement.dataset.theme = theme;
      }
    } catch (error) {
      // Storage can be blocked (some private windows). Then follow the computer.
    }
  </script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Timeline</h1>

    <!-- Search: anyone can search, signed in or not. The results show in
         their own view, "Search results", below. -->
    <form id="search-form" role="search">
      <label for="search-box">Search posts</label>
      <input id="search-box" type="search" maxlength="100" placeholder="a word or #tag"
             autocomplete="off">
      <button type="submit">Search</button>
    </form>

    <!-- The Colours switch. Auto follows the computer. The choice is kept in
         this browser only (localStorage), and never goes to the server. -->
    <div class="theme-row">
      <label for="theme">Colours</label>
      <select id="theme">
        <option value="auto">Auto (follow this computer)</option>
        <option value="light">Light</option>
        <option value="dark">Dark</option>
      </select>
    </div>

    <!-- The buttons that switch between views. Hidden while there is only one
         view: app.js shows it when a second view is added (addView). -->
    <nav id="views" aria-label="Views" hidden></nav>

    <!-- Shown when nobody is logged in in this window. Both start hidden: the
         page asks the server who is logged in, then shows one of the two. -->
    <section id="signed-out" class="account-forms" hidden>
      <form id="login-form" class="account-form">
        <h2>Log in</h2>
        <label for="login-name">Account name</label>
        <div class="at-box">
          <span aria-hidden="true">@</span>
          <input id="login-name" type="text" autocomplete="username" placeholder="aiko">
        </div>
        <label for="login-password">Password</label>
        <input id="login-password" type="password" autocomplete="current-password">
        <button type="submit">Log in</button>
      </form>

      <form id="signup-form" class="account-form">
        <h2>Sign up</h2>
        <label for="signup-name">Account name</label>
        <div class="at-box">
          <span aria-hidden="true">@</span>
          <input id="signup-name" type="text" autocomplete="username" placeholder="aiko">
        </div>
        <label for="signup-display-name">Display name</label>
        <input id="signup-display-name" type="text" autocomplete="nickname"
               placeholder="Aiko Tanaka">
        <label for="signup-password">Password (8 characters or more)</label>
        <input id="signup-password" type="password" autocomplete="new-password">
        <button type="submit">Sign up</button>
      </form>
    </section>

    <!-- Shown when someone is logged in in this window. -->
    <section id="signed-in" hidden>
      <p class="who">
        Signed in as <span id="who-display-name" class="post-author"></span>
        <span id="who-account-name" class="post-handle"></span> ·
        <button type="button" id="logout" class="link-button">Log out</button>
      </p>

      <form id="post-form">
        <label for="text">What is happening?</label>
        <textarea id="text" rows="3" placeholder="What is happening?"></textarea>
        <div class="post-row">
          <span id="count" class="count"></span>
          <button type="submit">Post</button>
        </div>
      </form>
    </section>

    <p id="status" class="status" role="status"></p>

    <!-- One view: the timeline. Another view would be a section next to it. -->
    <section data-view="timeline">
      <!-- timeline-flow: new posts wait behind this button while you read lower down. -->
      <button type="button" id="new-posts" class="new-posts" hidden></button>
      <ol id="timeline" class="timeline" aria-label="Posts, newest first" tabindex="-1"></ol>
      <!-- timeline-flow: older posts load when this comes near the screen, or when pressed. -->
      <p id="older-posts" class="older-posts"><button type="button" id="load-older" class="link-button">Show older posts</button></p>
    </section>

    <!-- The search results view. app.js adds its button with addView("search", ...). -->
    <section data-view="search" hidden>
      <p class="results-row">
        <span id="results-title" role="status"></span>
        <button type="button" id="back-to-timeline" class="link-button">Back to the timeline</button>
      </p>
      <ol id="results-list" class="timeline" aria-label="Search results, newest first"></ol>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
