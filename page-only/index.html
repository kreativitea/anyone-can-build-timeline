<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Timeline</title>
  <!-- The design system, in this order: tokens, the page, components, features.
       The four files are copies of the ones in with-backend/. -->
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="components.css">
  <link rel="stylesheet" href="features.css">
</head>
<body>
  <main>
    <h1>Timeline</h1>

    <div class="name-row">
      <div>
        <label for="author">Account name</label>
        <div class="at-box">
          <span aria-hidden="true">@</span>
          <input id="author" type="text" autocomplete="off" placeholder="aiko">
        </div>
      </div>
      <div>
        <label for="display-name">Display name</label>
        <input id="display-name" type="text" autocomplete="off" placeholder="Aiko Tanaka">
      </div>
    </div>

    <form id="post-form" class="card">
      <label for="text">What is happening?</label>
      <textarea id="text" rows="3" placeholder="What is happening?"></textarea>
      <div class="post-row">
        <span id="count" class="count">0 / 280</span>
        <button type="submit">Post</button>
      </div>
    </form>

    <p id="status" class="status" role="status"></p>

    <ol id="timeline" class="timeline card" aria-label="Posts, newest first"></ol>
  </main>

  <script src="app.js"></script>
</body>
</html>
